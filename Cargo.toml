[package]
name = "rummage"
version = "0.1.0"
edition = "2021"
default-run = "rum"

[[bin]]
name = "rum"
path = "src/main.rs"

[[bin]]
name = "header_demo"
path = "src/bin/header_demo.rs"

[dependencies]
ratatui = "0.28"
crossterm = "0.27"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
fuzzy-matcher = "0.3"
aes-gcm = "0.10"
argon2 = "0.5"
rand = "0.8"
ssh2 = "0.9"
ignore = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
socket2 = { version = "0.5", features = ["all"] }
unicode-width = "0.1"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "parsing", "yaml-load", "regex-fancy", "html", "plist-load"] }
base64 = "0.22"
zeroize = { version = "1", features = ["zeroize_derive"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[dev-dependencies]
tempfile = "3"
